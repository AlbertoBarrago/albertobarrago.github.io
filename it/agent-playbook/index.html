	<h1 class="blog-title" id="guide-title" tabindex="-1">Agent Playbook</h1>
	<p class="blog-intro">Una guida pratica a come lavoro con gli agenti di codice. Ogni pratica spiega perché conta, come si fa, e ti dà un blocco da copiare.</p>
	<p class="guide-meta">Ispirata a <em>Verification loops, del team di Claude Code di Anthropic</em> · aggiornata il <time datetime="2026-11-26">26/11/2026</time> · 9 pratiche · 7 insidie</p>
	<aside class="guide-latest"><span class="guide-label">Ultima modifica</span> <time datetime="2026-11-26">26/11/2026</time><p>Codex ora è il secondo parere di default, e le CLI dei reviewer girano con stdin chiuso, un file di log e un timeout. Le regole dell’auto mode funzionano solo nelle impostazioni utente, quindi i rischi di progetto diventano regole di permesso. Il registro dei miglioramenti chiede prima di scrivere, i dev server degli agenti non aprono schede del browser, e la roadmap guadagna tre voci.</p><a class="reader-nav-link" href="#changelog">tutte le modifiche →</a></aside>

<section class="guide-section" aria-labelledby="claude-md-rules">
	<h2 class="guide-title" id="claude-md-rules"><span class="guide-number">01</span><span>Regole di verifica nel CLAUDE.md</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-adopted">adottata</span><span class="guide-badge">aggiornata di recente</span><span>aggiornata il <time datetime="2026-11-18">18/11/2026</time></span><a class="guide-anchor" href="#claude-md-rules">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Un agente fa ciò che le istruzioni gli rendono facile. Senza regole scritte dichiara vittoria con una build verde, ripete un test instabile finché passa, o modifica il test invece del codice. Poche righe esplicite nel CLAUDE.md globale cambiano il comportamento predefinito di ogni sessione.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Metti le regole nel <code>~/.claude/CLAUDE.md</code> globale, così valgono per ogni repository, e lascia le specifiche di progetto nel CLAUDE.md del repository.</li><li>Verificare eseguendo: la skill <code>verify</code> del repository quando c’è, altrimenti pilotare la vera app.</li><li>Tre tentativi, poi stop: dopo tre correzioni fallite l’agente consegna l’output dell’errore e cosa ha provato.</li><li>Tieni i controlli fuori portata: una modifica non deve mai indebolire, nello stesso commit, i test, la configurazione di lint, la skill <code>verify</code> o il <code>REVIEW.md</code> che la giudicano.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Estratto per il tuo CLAUDE.md</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">markdown</span></div><pre class="guide-code is-prose"><code>## Verification
- After any non-trivial change: run build/typecheck and relevant tests before declaring it done
- If you can&#039;t verify, say so explicitly instead of assuming it works
- Don&#039;t edit tests just to make them pass: if a test fails, understand why before touching it
- Add/update tests when changing public behavior
- **Verify by running**: if the repo has a `.claude/skills/verify` skill, run it before saying &quot;ready for testing&quot;. Otherwise drive the real app (a browser automation tool for anything web) when the change is user-visible. Always state how the change was verified
- **Three rounds, then stop**: if a check still fails after three fix attempts, stop and bring me in with the failing output and what you tried
- **Flaky tests**: never add retries, sleeps or skips to make them pass. Find the root cause; if you can&#039;t, propose deleting the test with the reason written down, and wait for my confirmation
- **Checks are out of reach**: a change must not weaken or rewrite, in the same commit, the existing tests, lint/typecheck config, `verify` skill or `REVIEW.md` that judge it (adding new tests for new behavior is fine). If an existing check genuinely needs changing, do it in a separate commit and flag it to me

## Commit Messages
- Every commit ends with a `Verified:` trailer stating how the change was checked: `verify` (verify skill or end-to-end run), `tests` (automated tests only), `manual` (I tested it), or `none (&lt;reason&gt;)`. It is a verification stamp, not an attribution line
</code></pre></div>

	<h2 class="guide-title" id="verify-skill"><span class="guide-number">02</span><span>Una skill verify in ogni repository</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-adopted">adottata</span><span>aggiunta il <time datetime="2026-11-17">17/11/2026</time></span><a class="guide-anchor" href="#verify-skill">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">&quot;Esegui l’app&quot; significa una cosa diversa in ogni repository. Una skill <code>verify</code> lo scrive una volta sola: i controlli rapidi, come avviare il programma vero, quali flussi pilotare e cosa aspettarsi, così l’agente raccoglie prove invece di tirare a indovinare.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Copia il modello in <code>&lt;repo&gt;/.claude/skills/verify/SKILL.md</code> e sostituisci ogni segnaposto; elimina le sezioni che non servono.</li><li>Tienila in git: ignora <code>.claude/*</code> ma non <code>.claude/skills/</code>.</li><li>Eseguila due volte di fila su un main pulito prima di fidarti: è il tuo smoke test, deve essere veloce e deterministica.</li><li>Scrivi cosa è fuori ambito (chiamate API a pagamento, deploy, ciò che gli strumenti non vedono) e quando invece chiedere a una persona.</li><li>Ogni nuovo progetto parte con <code>.claude/skills/verify</code> dal modello, fin dal primo giorno.</li><li>Nei repository di lavoro o di clienti che non sono tuoi, tieni la skill in locale con <code>.git/info/exclude</code> e non committarla mai.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Modello</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">markdown</span></div><pre class="guide-code is-prose"><code>---
name: verify
description: Verify a change to &lt;PROJECT&gt; end to end before saying &quot;ready for testing&quot; or committing. Runs the cheap checks first, then drives the real &lt;app|CLI|service&gt; and reports the evidence plus the Verified trailer value.
---

&lt;!--
Copy it to &lt;repo&gt;/.claude/skills/verify/SKILL.md, replace every &lt;PLACEHOLDER&gt;,
delete the sections that do not apply and this comment. Make sure .claude/skills/
is tracked by git (ignore .claude/* but not .claude/skills/).
Keep it fast and deterministic: run it twice in a row on a clean main before trusting it.
--&gt;

# Verify &lt;PROJECT&gt;

Run the steps in order and stop at the first failure. Fix the code, not the check.

## Rules

- Never add retries, sleeps or skips, and never edit the existing tests, lint/typecheck config or this skill to make a step pass.
- If a step still fails after three fix attempts, stop and report the failing output and what was tried.
- Clean up what you started (servers, temp dirs) even when a step fails.

## 1. Cheap checks

    &lt;typecheck command&gt;
    &lt;lint command, check-only, no auto-fix&gt;
    &lt;test command&gt;

## 2. Run it

&lt;How to start the real thing: dev server, built CLI, local service. Where it listens, how to tell it is ready, how to stop it.&gt;

Servers: pick a free port at runtime with `--strictPort` (or equivalent), fail the wait loop if your process dies, and check an identifying marker (page title, health payload) before testing. Other sessions and agents run their own servers: never reuse or stop one you did not start.

Smoke flows (always):

1. &lt;Flow&gt;: &lt;steps&gt;. Expected: &lt;observable result&gt;.
2. &lt;Flow that must fail&gt;: &lt;steps&gt;. Expected: &lt;error, exit code&gt;.

Flows for the changed area: &lt;where the feature map lives, e.g. docs/MANUAL.md&gt;. Pick the flows that cover the diff and check their expected results.

Out of scope: &lt;commands this skill must not run, e.g. paid API calls, deploys&gt;.

## 3. Report

Reply with:

- each command run with its exit code;
- the evidence for every flow (output excerpt, screenshot path);
- the `Verified:` trailer value: `verify` when steps 1 and 2 passed, `tests` when only step 1 ran, `none (&lt;reason&gt;)` otherwise.
</code></pre></div><div class="guide-snippet"><div class="guide-snippet-title">Avvio del progetto, e skill solo locali per i repository non tuoi</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># New project: start with a verify skill from day one.
mkdir -p .claude/skills/verify
cp &lt;path-to-your-template&gt;/SKILL.md .claude/skills/verify/SKILL.md
# Track the skill, ignore the rest of .claude/ (in .gitignore):
#   .claude/*
#   !.claude/skills/

# Work or client repo you don&#039;t own: keep the skill local, never commit it.
# .git/info/exclude works like .gitignore but is never shared.
echo &quot;.claude/skills/verify/&quot; &gt;&gt; .git/info/exclude
git status --short .claude   # must print nothing
</code></pre></div><div class="guide-snippet"><div class="guide-snippet-title">Sezione per una suite end-to-end con Playwright</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">markdown</span></div><pre class="guide-code is-prose"><code>## 2. End-to-end (Playwright)

Before running the suite, make sure the port in `playwright.config` is free. With `reuseExistingServer: true`, Playwright happily tests whatever already answers on that port: another project, or this project on another branch.

    PORT=&lt;port from playwright.config webServer.url&gt;
    if lsof -tiTCP:$PORT -sTCP:LISTEN &gt;/dev/null; then
      echo &quot;port $PORT is busy: stop, do not test someone else&#039;s server&quot;; exit 1
    fi
    BROWSER=none npx playwright test

- `BROWSER=none` keeps `vite --open` from opening browser windows during the run.
- `Executable doesn&#039;t exist at ...` means the browser build for this Playwright version is missing. It is setup, not a test failure: run `npx playwright install chromium`, then run the suite again. Do not count it as one of the three rounds.
- Use selectors that do not depend on the UI language (roles with stable names, `data-*` hooks), or set `use: { locale: &#039;en-US&#039; }` in the config.
</code></pre></div><details class="guide-snippet"><summary class="guide-snippet-title">Esempio reale: Markasso, un’app web pilotata con Playwright MCP</summary><div class="guide-snippet-bar"><span class="guide-snippet-lang">markdown</span></div><pre class="guide-code is-prose"><code>---

# Verify Markasso

Run the steps in order from the repo root and stop at the first failure. Fix the code, not the check.

## Rules

- Never add retries, sleeps or skips, and never edit the existing tests, `biome.json`, `tsconfig*.json`, `vitest.config.ts` or this skill to make a step pass.
- If a step still fails after three fix attempts, stop and report the failing output and what was tried.
- Use `pnpm lint:ci`, never `pnpm lint`: the latter rewrites files.
- Never reuse or stop a dev server you did not start: other sessions and agents run their own (5173 is usually the user&#039;s). Start your own on a free port picked at runtime and always stop it, even when a step fails.

## 1. Cheap checks

    pnpm typecheck
    pnpm lint:ci
    pnpm test

`pnpm test` also runs `mcp/tests/`. If the diff touches `mcp/`, also build the server:

    pnpm mcp:build

## 2. Run it in a real browser (Playwright MCP)

Start a private dev server on a free port and wait until it answers. The loop fails if the server dies, so a port taken in the meantime can never make you test someone else&#039;s server:

    PORT=$(node -e &quot;const s=require(&#039;net&#039;).createServer();s.listen(0,()=&gt;{console.log(s.address().port);s.close()})&quot;)
    pnpm dev --port $PORT --strictPort &gt; &lt;scratchpad&gt;/markasso-dev.log 2&gt;&amp;1 &amp;
    PID=$!
    until curl -fs -o /dev/null http://localhost:$PORT/; do
      kill -0 $PID 2&gt;/dev/null || { tail -20 &lt;scratchpad&gt;/markasso-dev.log; exit 1; }
      sleep 0.5
    done
    echo $PORT

With the Playwright MCP tools (`mcp__playwright__*`: headless Chrome, isolated profile, 1280x800 viewport, real mouse input). The browser UI language follows the system, so never select by translated text: use ids, shortcuts and the shortcut hint in titles (`(R /`).

Boot smoke:

1. `browser_navigate` to `http://localhost:$PORT/`. Expected: title starts with `Markasso` (any other title means you reached a server that is not yours: stop).
2. `browser_console_messages`. Expected: no errors.
3. `browser_evaluate`:

       () =&gt; ({ canvas: !!document.getElementById(&#039;main&#039;), toolbarButtons: document.querySelectorAll(&#039;#toolbar button&#039;).length, rectangle: !!document.querySelector(&#039;#toolbar button[title*=&quot;(R /&quot;]&#039;) })

   Expected: `canvas: true`, `toolbarButtons` greater than 0, `rectangle: true`.

Canvas flow (draw a rectangle):

4. The isolated profile always opens the welcome dialog, and it swallows keyboard shortcuts. Dismiss it with `browser_evaluate` `() =&gt; { document.querySelector(&#039;.wl-cta&#039;)?.click(); }`, `browser_wait_for` 0.5 seconds, then `browser_press_key` `r` to pick the Rectangle tool.
5. `browser_mouse_drag_xy` from (400, 200) to (540, 300). Stay right of x = 260: the style panel covers the left edge of the canvas, and a drag that starts on it selects text instead of drawing.
6. `browser_wait_for` 1.5 seconds (the session save is debounced), then `browser_evaluate`:

       () =&gt; (JSON.parse(localStorage.getItem(&#039;markasso-session&#039;) ?? &#039;{&quot;elements&quot;:[]}&#039;).elements).map((e) =&gt; ({ type: e.type, x: Math.round(e.x), y: Math.round(e.y), w: Math.round(e.width), h: Math.round(e.height) }))

   Expected: exactly one element of type `rectangle`, about 140 x 100.
7. `browser_take_screenshot` as evidence. Playwright MCP only writes under its output directory (set with `--output-dir` in your MCP server config): leave the file name to it and report the path it returns.

Flows for the changed area: `docs/MANUAL.md` is the feature map (tools, shortcuts, menus). Pick the flows that cover the diff and drive them the same way: keyboard shortcuts and coordinates on the canvas, state checks through `localStorage` or the DOM.

8. `browser_close`, then stop the server:

       kill $(lsof -tiTCP:$PORT -sTCP:LISTEN)

Reply with:

- each command with its exit code, and the vitest totals;

description: Verify a change to Themis end to end before saying &quot;ready for testing&quot; or committing. Runs npm run check, rebuilds dist/, then drives the real CLI (check, init, status) in a temp project and reports the evidence plus the Verified trailer value.

# Verify Themis

Run the steps in order from the repo root and stop at the first failure. Fix the code, not the check.

## Rules

- Never add retries, sleeps or skips, and never edit the existing tests, `biome.json`, `tsconfig*.json`, `vitest.config.ts` or this skill to make a step pass.
- If a step still fails after three fix attempts, stop and report the failing output and what was tried.
- Never delete `dist/`: `~/.local/bin/themis` links to `dist/cli/main.js`. Rebuilding in place is fine.
- Do not run commands that call agents (`plan`, `tests`, `run`, `retro`): they cost money and minutes. Their logic is covered by the vitest suite with `FakeAgentRunner`/`FakeExecutor`.
- Always remove the temp directory, even when a step fails.

## 1. Cheap checks

    npm run check

(typecheck, Biome, vitest including `tests/e2e/`).

## 2. Build

    npm run build

## 3. Drive the real CLI

Run in bash (the commands rely on bash arrays and `PIPESTATUS`):

    bash -c &#039;
    set -u
    C=(node &quot;$PWD/dist/cli/main.js&quot;)
    T=$(mktemp -d)
    trap &quot;rm -rf \&quot;$T\&quot;&quot; EXIT

    &quot;${C[@]}&quot; check examples/webhook-service/spec.md; echo &quot;check-valid exit=$?&quot;

    printf -- &quot;---\nthemis: 0.2\nstack: node-ts\n---\n# X\n&quot; &gt; &quot;$T/bad.md&quot;
    &quot;${C[@]}&quot; check &quot;$T/bad.md&quot;; echo &quot;check-invalid exit=$?&quot;

    cp examples/getting-started/spec.md &quot;$T/&quot;
    cd &quot;$T&quot; &amp;&amp; git init -q
    &quot;${C[@]}&quot; init; echo &quot;init exit=$?&quot;
    &quot;${C[@]}&quot; status --json; echo &quot;status exit=$?&quot;
    ls .themis
    &#039;

Expected:

| Flow | Expected |
|---|---|
| check-valid | exit 0, `valid (6 acceptance criteria, ...)` |
| check-invalid | exit 1, errors `invalid-field`, `unsupported-version`, `no-acceptance-criteria` |
| init | exit 0, writes `.themis/agents/*.md`, `.gitignore`, installs dependencies (needs network for `npm install`), ends with `next: themis plan` |
| status | exit 0, JSON with `spec.ok: true`, `plan: &quot;absent&quot;`, `contract.state: &quot;absent&quot;` |
| .themis | contains `agents`, `guard.mjs`, `local.json`, `verify.sh` |

If the change touches a command not listed above (for example `new`, `approve`, a new flag or a new diagnostic), add a run of that command against the temp project, with its expected exit code and output, to the report.

## 4. Report

Reply with:

- each command with its exit code;
- the relevant output lines for every flow, and any deviation from the table;
- the `Verified:` trailer value: `verify` when steps 1 to 3 passed, `tests` when only step 1 ran, `none (&lt;reason&gt;)` otherwise.
</code></pre><p class="guide-origin">da <a class="terminal-link" href="https://github.com/AlbertoBarrago/themis" target="_blank" rel="noopener noreferrer">Themis ↗</a></p></details>
	
</section><section class="guide-section" aria-labelledby="verified-trailer">
	<h2 class="guide-title" id="verified-trailer"><span class="guide-number">03</span><span>Un trailer Verified su ogni commit</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-adopted">adottata</span><span>aggiunta il <time datetime="2026-11-17">17/11/2026</time></span><a class="guide-anchor" href="#verified-trailer">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">A posteriori nessuno ricorda se un commit è stato eseguito, testato o solo compilato. Un trailer di una riga lo registra, e siccome <code>none</code> è ammesso, i commit non verificati restano onesti e facili da trovare.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Chiudi ogni messaggio di commit con <code>Verified: verify</code>, <code>tests</code>, <code>manual</code> o <code>none (&lt;reason&gt;)</code>.</li><li>Lascia che sia il report della skill <code>verify</code> a dire all’agente quale valore usare.</li><li>Interrogalo con i trailer di <code>git log</code>: non serve altro.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Formato e query</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># The last line of every commit message says how the change was checked:
#   Verified: verify          verify skill or end-to-end run passed
#   Verified: tests           automated tests only
#   Verified: manual          a human tried it
#   Verified: none (&lt;reason&gt;) not verified, and why
git commit -m &quot;feat: add the agent playbook&quot; -m &quot;Verified: tests&quot;

# How was each recent commit verified?
git log -20 --format=&#039;%h %&lt;(10,trunc)%(trailers:key=Verified,valueonly,separator=%x20) %s&#039;

# Commits that shipped unverified, with their reason
git log --grep=&#039;^Verified: none&#039; --format=&#039;%h %s  [%(trailers:key=Verified,valueonly,separator=%x20)]&#039;
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="verify-gate">
	<h2 class="guide-title" id="verify-gate"><span class="guide-number">04</span><span>Un hook Stop che osserva prima di bloccare</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-trial">in prova</span><span class="guide-badge">nuova</span><span>aggiunta il <time datetime="2026-11-18">18/11/2026</time></span><a class="guide-anchor" href="#verify-gate">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Le regole dicono &quot;verifica prima di dire che hai finito&quot;, ma niente ti dice quanto spesso una sessione finisce senza farlo. Un hook Stop può misurarlo. Bloccare subito punirebbe ogni falso positivo, quindi la prima versione si limita a osservare e ad annotare ciò che ha visto.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Eseguilo alla fine di ogni turno: legge il transcript della sessione e registra un verdetto per ogni repository modificato, <code>verify</code>, <code>commands</code>, <code>docs-only</code> o <code>none</code>.</li><li>Conta solo le modifiche della sessione corrente, così altre sessioni sullo stesso repository non possono generare falsi allarmi.</li><li>Non bloccare mai, non stampare mai, esci sempre con 0: un hook rotto non deve rompere la sessione.</li><li>Leggi il report dopo una o due settimane, correggi i falsi positivi, e solo allora decidi se bloccare i turni che finiscono con <code>none</code>.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Registrazione e report</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># A Stop hook that only watches: it runs at the end of every turn, never
# blocks, never prints, always exits 0. It reads the session transcript and
# appends one JSON line per repo the turn edited, with a verdict:
#
#   verify     the repo&#039;s `verify` skill ran after the last edit
#   commands   a test/build/lint/typecheck command ran after the last edit
#   docs-only  only documentation files were edited
#   none       code was edited and nothing checked it afterwards
#
# Only edits made by this session count (Edit, Write, NotebookEdit calls in
# its own transcript), so other sessions on the same repo raise no false alarms.

# Merge this into the &quot;hooks&quot; object of ~/.claude/settings.json, next to your
# other hooks: do not overwrite the file. The guard matters: a Stop hook that
# exits 2 sends the agent back to work, and python3 exits 2 when the script is
# missing, so a hook meant to only watch would block every turn.
{
  &quot;Stop&quot;: [
    {
      &quot;hooks&quot;: [
        {
          &quot;type&quot;: &quot;command&quot;,
          &quot;command&quot;: &quot;f=\&quot;$HOME/.claude/hooks/verify-gate.py\&quot;; [ -f \&quot;$f\&quot; ] &amp;&amp; python3 \&quot;$f\&quot;; exit 0&quot;,
          &quot;timeout&quot;: 10
        }
      ]
    }
  ]
}

# After a week or two, read the verdicts per repo before deciding to enforce:
python3 ~/.claude/hooks/verify-gate.py --report
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="browser-tool">
	<h2 class="guide-title" id="browser-tool"><span class="guide-number">05</span><span>Scegliere lo strumento browser</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-trial">in prova</span><span class="guide-badge">aggiornata di recente</span><span>aggiornata il <time datetime="2026-11-20">20/11/2026</time></span><a class="guide-anchor" href="#browser-tool">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Una skill verify vale quanto il browser che la pilota. Abbiamo fatto un test vero sul canvas di Markasso: disegnare un rettangolo e controllare che finisca nel localStorage. I risultati hanno deciso quale strumento fa cosa.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Telemaco: FAIL. Nessun motore di layout, e <code>browser_evaluate</code> non aspetta le Promise.</li><li>chrome-devtools-mcp: PASS solo con eventi sintetici inviati da uno script, perché non ha il trascinamento a coordinate; circa 36 s.</li><li>Playwright MCP: PASS con input reale del mouse (<code>browser_mouse_drag_xy</code>), circa 24 s. Al primo tentativo ha perfino colpito un pannello sopra il canvas, proprio come farebbe un utente vero.</li><li>Decisione, scritta nel CLAUDE.md globale: Telemaco resta per leggere il web, cercare e fare fetch stealth; pilotare e verificare le app locali è passato a Playwright MCP, con versione fissata, headless e isolato. La skill verify di Markasso ora disegna sul canvas con input reale del mouse, e Telemaco 0.3.0 ha tolto tutto il resto: niente server CDP, niente scrape, niente remote.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Playwright MCP per le app locali</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># Playwright MCP to drive local apps with real mouse and keyboard input.
# Pin the version: the server is fetched by npx on every start.
# Pick the current one with `npm view @playwright/mcp version`.
# --scope user:   one setup for every project, not just the current one.
# --headless:     no window stealing focus while you work.
# --isolated:     in-memory profile, so parallel sessions don&#039;t fight over one profile.
#                 It also means first-run dialogs show up on every launch.
# --caps vision:  coordinate tools such as browser_mouse_drag_xy, needed for canvas work.
# --output-dir:   screenshots and traces go to a cache folder, not into the repo.
PLAYWRIGHT_MCP_VERSION=0.0.85
claude mcp add --scope user playwright -- npx -y &quot;@playwright/mcp@$PLAYWRIGHT_MCP_VERSION&quot; \
  --browser chrome --headless --isolated --caps vision \
  --viewport-size 1280x800 --output-dir &quot;$HOME/.cache/playwright-mcp&quot;

# The browser follows the system locale, so the app&#039;s UI may be translated:
# select by ids, classes, roles or shortcuts, never by visible text.
# If the app has no stable hooks yet, force a locale with a config file:
#   { &quot;browser&quot;: { &quot;contextOptions&quot;: { &quot;locale&quot;: &quot;en-US&quot; } } }
# and add --config &quot;$PWD/playwright-mcp.json&quot; to the command above.
</code></pre><p class="guide-origin">da <a class="terminal-link" href="https://github.com/microsoft/playwright-mcp" target="_blank" rel="noopener noreferrer">Playwright MCP ↗</a></p></div>
	
</section><section class="guide-section" aria-labelledby="second-opinion">
	<h2 class="guide-title" id="second-opinion"><span class="guide-number">06</span><span>Un secondo parere con Codex o opencode</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-trial">in prova</span><span class="guide-badge">aggiornata di recente</span><span>aggiornata il <time datetime="2026-11-26">26/11/2026</time></span><a class="guide-anchor" href="#second-opinion">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Un agente che rivede il proprio diff ne condivide i punti ciechi. Un secondo modello con un prompt nuovo trova bug diversi, a patto di dargli il codice e non la tua conclusione, e di trattare il suo output come un input, non come la verità.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Codex è il reviewer di default: la prima scelta per ogni diff non banale, ogni verifica di un piano e ogni sessione di debug bloccata, con una sola chiamata per review perché la sua quota è limitata. I modelli gratuiti di opencode si occupano delle domande leggere, delle modifiche delegate in un worktree e delle esecuzioni in parallelo o di controllo.</li><li>Scegli il modello in base al compito: un piccolo modello gratuito per una domanda veloce, Codex per un diff, un branch, un piano o una sessione di debug, e due modelli gratuiti in parallelo, con i risultati confrontati, quando vuoi un’esecuzione di controllo accanto.</li><li>Una CLI di review lanciata da uno script o da un agente non ha nessuno alla tastiera: chiudi il suo stdin, scrivi l’output in un file di log e falla girare in background con un timeout. Se resta in attesa di input si blocca in silenzio, e la review non arriva mai.</li><li>Chiedi prima di eseguirlo, e di’ cosa invii e perché.</li><li>Quando il repository ha un <code>REVIEW.md</code>, prendilo dal branch di base, invialo e chiedi al reviewer di applicare le regole il cui trigger corrisponde al diff.</li><li>Sola lettura per default: l’agente <code>plan</code> di opencode o la sandbox <code>read-only</code> di Codex. Scrittura solo dentro un worktree git separato.</li><li>Sola lettura non vuol dire innocuo: l’agente <code>plan</code> blocca le modifiche ai file, non i comandi shell. Il prompt vieta build, clean, install e ogni altro comando che scrive, la compilazione usa una directory di build separata, e nessuna review parte mentre un build o i test stanno usando lo stesso albero.</li><li>Un subagent che lavora su un altro repository crea lì il proprio worktree con <code>git worktree add</code>: l’isolamento a worktree dello strumento agent copre solo il repository della sessione.</li><li>Usa solo modelli il cui fornitore non conserva i dati e non ci addestra, e non inviare mai segreti o codice di clienti che non puoi condividere.</li><li>Verifica ogni segnalazione sul codice, correggi ciò che è reale, e annota cosa hai scartato e perché.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Comandi</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># Two reviewers with different roles:
#   Codex     the default reviewer: any non-trivial diff, a plan check, a stuck debug session;
#             one call per review, its quota is limited.
#   opencode  free models for light questions, delegated edits in a worktree,
#             and parallel or control runs.

# Size the model to the task, and use only providers that keep no data and do not train on it:
#   light     explain a snippet, a small question, a trivial edit      one small free model
#   standard  review of a small or medium diff                          Codex
#   deep      branch review, debug after failed hypotheses, a plan      Codex, plus two free models
#                                                                       in parallel as a control run

# Review a diff, read-only: opencode&#039;s built-in `plan` agent cannot edit files,
# but it can still run shell commands. The prompt forbids every writing command,
# and no review runs while a build or test run is using the same tree.
# If the repo has a REVIEW.md, send it from the base branch, never from the working tree.
# `git diff main` covers commits and uncommitted work; an empty diff is no review.
git diff main &gt; /tmp/change.diff
test -s /tmp/change.diff || echo &quot;empty diff: nothing to review&quot;
git show main:REVIEW.md &gt; /tmp/review-rules.md 2&gt;/dev/null
opencode run --agent plan -m &lt;model&gt; \
  &quot;Review the diff in /tmp/change.diff for correctness bugs, unescaped input and missing tests. \
If /tmp/review-rules.md is not empty, apply the rules whose trigger matches a path in the diff. \
Give each finding a file:line, a severity (must-fix / should-fix / nit) and a concrete failure scenario. \
Do not edit files. Do not run build, clean, install or any other command that writes; \
if you must compile, use a separate build directory.&quot; &gt; review.md

# Delegate a scoped task with write access, only inside a separate git worktree.
opencode run -w &lt;worktree-name&gt; -m &lt;model&gt; &quot;&lt;task, files, what is already ruled out&gt;&quot;

# Codex, the default: read-only sandbox, findings written to a file.
# Nobody is at the keyboard: close stdin, keep the log in a file (never /dev/null),
# and run it in the background under a timeout, or it can wait for input forever.
perl -e &#039;alarm shift; exec @ARGV&#039; 900 \
  codex exec -s read-only -C . -o codex.md &quot;&lt;same review prompt&gt;&quot; \
  &lt; /dev/null &gt; codex.log 2&gt;&amp;1 &amp;
# `codex review --base main` is quicker but takes no rules file: prefer `codex exec`
# with the same prompt when the repo has a REVIEW.md.
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="review-md">
	<h2 class="guide-title" id="review-md"><span class="guide-number">07</span><span>Un REVIEW.md che la modifica non può riscrivere</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-trial">in prova</span><span class="guide-badge">nuova</span><span>aggiornata il <time datetime="2026-11-20">20/11/2026</time></span><a class="guide-anchor" href="#review-md">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Un prompt di review generico trova problemi generici. Un <code>REVIEW.md</code> dice al reviewer cosa si rompe in questo codice, e siccome viene sempre letto dal branch di base, una modifica non può ammorbidire le regole che la giudicano.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Dai al reviewer il diff insieme a <code>git show &lt;base&gt;:REVIEW.md</code>, mai la copia nel branch sotto review.</li><li>Ogni regola nasce da un bug reale, citando i commit che lo correggono, o da un vincolo di progetto dichiarato. Niente consigli generici.</li><li>Rendi ogni regola verificabile da un diff: un trigger sui percorsi, un controllo concreto, e il motivo per cui esiste.</li><li>Tienilo sotto le 15 regole circa: aggiungine o affinane una quando un bug sfugge alla review, elimina quelle che non scattano mai o producono solo rumore.</li><li>Non c’è ancora un <code>REVIEW.md</code>? Quando l’agente propone una review, propone anche una prima versione ricavata dai commit <code>fix:</code> in <code>git log</code>, citandone gli hash. Si limita a proporla: il file viene scritto solo dopo il sì di una persona.</li><li>Quando un fix corregge un bug sfuggito a una review precedente, l’agente propone la regola da aggiungere o affinare: trigger, controllo e commit del fix.</li><li>Modifica <code>REVIEW.md</code> in un commit a parte, mai insieme al codice che giudica.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Modello</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">markdown</span></div><pre class="guide-code is-prose"><code>&lt;!--
Copy it to &lt;repo&gt;/REVIEW.md, replace the placeholders, delete this comment.

How it is used: the reviewer (Codex, opencode, /code-review) gets the diff plus
this file read from the base branch (`git show &lt;base&gt;:REVIEW.md`), never from
the branch under review, so a change cannot rewrite the rules that judge it.
Change REVIEW.md in its own commit, never together with the code it judges.

Writing rules:
- Every rule comes from a real bug (cite the fix commits) or a stated project
  constraint (cite CLAUDE.md, an ADR, a spec). No generic advice.
- A rule must be checkable from a diff: concrete trigger paths, concrete check.
- Keep it under about 15 rules. When a bug slips through review, add or sharpen
  a rule; when a rule never triggers or only produces noise, delete it.
--&gt;

# Review guide: &lt;PROJECT&gt;

Check only the rules whose trigger matches a path in the diff. For each finding, name the rule (R1, R2, ...) or say &quot;outside REVIEW.md&quot; when it is a bug no rule covers. Report real defects with a concrete failure scenario; skip anything listed under &quot;Do not flag&quot;.

## Rules

### R1: &lt;short title&gt;
Trigger: &lt;paths or globs&gt;
Check: &lt;what must hold in the diff&gt;
Why: &lt;the failure it prevents&gt; (fixes: &lt;sha&gt;, &lt;sha&gt; | source: &lt;CLAUDE.md, ADR, spec section&gt;)

## Do not flag

- Formatting, import order and lint-level style: &lt;linter&gt; enforces them in CI.
- &lt;Deliberate convention that looks wrong but is intended, with its source.&gt;
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="improvement-log">
	<h2 class="guide-title" id="improvement-log"><span class="guide-number">08</span><span>Un registro dei miglioramenti per il setup stesso</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-trial">in prova</span><span class="guide-badge">nuova</span><span>aggiornata il <time datetime="2026-11-26">26/11/2026</time></span><a class="guide-anchor" href="#improvement-log">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Le regole vengono saltate, gli hook mancano un caso, un passo del rilascio resta manuale finché non si rompe. Se lo sistemi sul momento, la lezione si perde; se lo sistemi in mezzo a un altro task, allarga il diff. Un registro breve le tiene in un posto solo finché ognuna non ha il suo fix.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Tieni un file accanto alle regole dell’agente, una voce per problema: cosa è successo, il fix proposto, uno stato (<code>open</code>, <code>done &lt;sha or PR&gt;</code>, <code>dropped (&lt;reason&gt;)</code>).</li><li>Quando qualcosa si rompe, una regola viene saltata o un passo si rivela manuale e fragile, l’agente propone una voce in una riga e la scrive solo dopo il sì della persona.</li><li>Registra solo i problemi del setup: una piccola svista durante un task personale e occasionale non è una lezione per le regole e resta fuori.</li><li>Mentre lavora su un progetto, l’agente chiede prima di scrivere qualsiasi cosa nel repository di configurazione, anche quando una regola sembra richiederlo, così le modifiche al setup non si infilano in una sessione che non c’entra.</li><li>Ogni fix è un task e un branch a sé; chiudi la voce con il suo commit o la sua PR.</li><li>Quando c’è tempo per migliorare il setup, parti dalle voci <code>open</code> invece che dalla memoria.</li><li>Preferisci i fix che rendono una regola imposta invece che ricordata: un hook o un controllo in uno script valgono più di un’altra riga di istruzioni.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Modello</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">markdown</span></div><pre class="guide-code is-prose"><code># Improvement log

What in this setup (rules, hooks, scripts, release flows) should get better.
One entry per issue, newest at the bottom. Each fix is its own task and branch.

Status: `open`, `done &lt;sha or PR&gt;`, or `dropped (&lt;reason&gt;)`.

## YYYY-MM-DD: &lt;short title of what went wrong&gt;

- **What happened:** the agent committed before the user confirmed, against
  the commit rule. Caught at once, nothing was pushed.
- **Proposal:** a hook on `git commit` that always asks for confirmation, so
  the rule no longer depends on the agent remembering it.
- **Status:** open

## YYYY-MM-DD: &lt;a release step that is still manual&gt;

- **What happened:** the release script tagged a version with no changelog
  section; someone noticed by hand.
- **Proposal:** the script refuses to start when the changelog has no section
  for the version.
- **Status:** done &lt;sha or PR&gt;
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="themis-gates">
	<h2 class="guide-title" id="themis-gates"><span class="guide-number">09</span><span>Themis: cancelli e un contratto bloccato</span></h2>
	<p class="guide-section-meta"><span class="guide-status is-adopted">adottata</span><span>aggiunta il <time datetime="2026-11-17">17/11/2026</time></span><a class="guide-anchor" href="#themis-gates">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Per lavori più grandi le regole non bastano: l’agente non deve poter spostare la porta. Themis trasforma una specifica in test di accettazione, li blocca tramite digest, e solo allora lascia scrivere agli agenti il codice che un verifier separato giudica.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Scrivi la specifica: obiettivo, passi di verifica, limiti, criteri di accettazione.</li><li>Approva il piano (cancello 1) e i test (cancello 2): approvare i test registra i digest di test, specifica, verifier e configurazione in <code>.themis/lock.json</code>, e una guardia rifiuta qualsiasi modifica.</li><li>Esegui: ogni task lavora nel proprio worktree; l’exit code del verifier dice se riprovare o se è bloccato, e <code>max_iterations</code> limita i tentativi.</li><li>Chiudi con una retro (cancello 3): gli errori sfuggiti diventano modifiche alle istruzioni degli agenti.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Il flusso a cancelli</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code>themis new                # spec skeleton: goal, verify steps, limits, acceptance criteria
themis check              # every problem with line, column and field
themis init               # generates the judge: verifier + guard, no AI involved

themis plan               # planner agent proposes the task graph
themis approve plan       # gate 1: does the plan make sense?

themis tests              # test-author agent writes tests/acceptance/
git add -A &amp;&amp; git commit -m &quot;themis contract&quot;
themis approve tests      # gate 2: digests of tests, spec, verifier and config go into .themis/lock.json
git add -A &amp;&amp; git commit -m &quot;lock contract&quot;

themis run                # each task in its own worktree, verifier exit 1 = retry, 2 = blocked
themis status             # gates, tasks, iterations against max_iterations, cost

themis retro              # retro agent turns misses into instruction changes
themis approve retro      # gate 3: apply them, then commit .themis/agents/
</code></pre><p class="guide-origin">da <a class="terminal-link" href="https://github.com/AlbertoBarrago/themis" target="_blank" rel="noopener noreferrer">Themis ↗</a></p></div>

<h2 class="guide-part">Insidie che abbiamo incontrato</h2>
<section class="guide-section" aria-labelledby="dev-server-port">
	<h2 class="guide-title" id="dev-server-port"><span class="guide-number">01</span><span>La porta del dev server è di qualcun altro</span></h2>
	<p class="guide-section-meta"><span class="guide-badge">aggiornata di recente</span><span>aggiornata il <time datetime="2026-11-26">26/11/2026</time></span><a class="guide-anchor" href="#dev-server-port">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Più sessioni e agenti girano insieme. Un agente che trova occupata la porta 5173 può testare tranquillamente il server avviato da un altro agente, su codice diverso, e riportare un successo che non vale nulla.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Scegli una porta libera al momento e avvia con <code>--strictPort</code>, così una collisione fallisce invece di spostarsi in silenzio.</li><li>Fai fallire il ciclo di attesa se il tuo processo muore.</li><li>Prima di testare controlla un segno che il server è tuo (il titolo della pagina, una risposta di health), e non fermare mai un server che non hai avviato tu.</li><li>Playwright con una porta fissa e <code>reuseExistingServer</code> ha la stessa trappola: controlla che la porta sia libera prima di lanciare la suite.</li><li>Avvialo con <code>BROWSER=none</code>: una configurazione con <code>server.open</code> apre una scheda sul desktop a ogni avvio, e gli agenti ne fanno tanti. Passare <code>--open false</code> a Vite è peggio, apre il percorso <code>/false</code>.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Porta libera, rigida, controllata</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># Never test a dev server you did not start: another session or agent may own the port.
PORT=$(node -e &quot;const s=require(&#039;net&#039;).createServer();s.listen(0,()=&gt;{console.log(s.address().port);s.close()})&quot;)
# BROWSER=none: no desktop tab on every start (and never `--open false`: Vite opens /false).
BROWSER=none npm run dev -- --port $PORT --strictPort &gt; dev.log 2&gt;&amp;1 &amp;
PID=$!
until curl -fs -o /dev/null http://localhost:$PORT/; do
  kill -0 $PID 2&gt;/dev/null || { tail -20 dev.log; exit 1; }   # server died: fail, don&#039;t wait forever
  sleep 0.5
done

# Before testing, check a marker that proves the server is yours (here, the page title).
curl -fs http://localhost:$PORT/ | grep -q &#039;&lt;title&gt;My App&#039; || { echo &quot;not my server&quot;; exit 1; }

# ... run the checks, then always stop what you started.
kill $PID
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="telemaco-no-layout">
	<h2 class="guide-title" id="telemaco-no-layout"><span class="guide-number">02</span><span>Telemaco ha un DOM, non un layout</span></h2>
	<p class="guide-section-meta"><span>aggiunta il <time datetime="2026-11-17">17/11/2026</time></span><a class="guide-anchor" href="#telemaco-no-layout">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Telemaco esegue JavaScript e DOM reali ma non ha un motore di layout: le dimensioni sono segnaposto e gli stili calcolati tornano ai valori predefiniti. Hit-testing sul canvas e controlli visivi non si possono pilotare da lì, <code>browser_evaluate</code> ritorna prima che una Promise si risolva, e fingere il contrario produce falsi successi.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Controlla struttura e stato: titoli, numero di elementi, testo, errori in console.</li><li>Pilota i form tramite il DOM, per esempio <code>form.requestSubmit()</code>.</li><li>Copri la logica del canvas con test unitari, e chiedi a una persona i controlli visivi e su schermo da telefono (<code>Verified: manual</code>).</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Un controllo solo sul DOM</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">javascript</span></div><pre class="guide-code"><code>// Telemaco runs real JavaScript and a real DOM, but has no layout engine:
// getBoundingClientRect returns placeholders and getComputedStyle returns defaults.
// So assert on structure and state, never on pixels, sizes or computed colors.
// browser_evaluate does not await Promises: return plain values, and read async
// results in a second call (store them on window in the first one).

// 1. browser_navigate to http://localhost:$PORT/ and check the title first.
document.title.startsWith(&#039;My App&#039;) || &#039;not my server: stop&#039;;

// 2. browser_evaluate: drive the app through the DOM and return evidence.
(() =&gt; {
  const input = document.querySelector(&#039;#search&#039;);
  input.value = &#039;invoices&#039;;
  input.form.requestSubmit();          // fires the app&#039;s own submit handler
  return {
    results: document.querySelectorAll(&#039;.result&#039;).length,
    empty: !!document.querySelector(&#039;.empty-state&#039;),
  };
})();

// Out of scope: canvas drawing and hit-testing, visual layout, phone widths.
// Cover canvas logic with unit tests; ask a human for the visual check (Verified: manual).
</code></pre><p class="guide-origin">da <a class="terminal-link" href="https://github.com/AlbertoBarrago/telemaco" target="_blank" rel="noopener noreferrer">Telemaco ↗</a></p></div>
	
</section><section class="guide-section" aria-labelledby="ui-language">
	<h2 class="guide-title" id="ui-language"><span class="guide-number">03</span><span>Un browser vero parla la lingua del sistema</span></h2>
	<p class="guide-section-meta"><span>aggiunta il <time datetime="2026-11-17">17/11/2026</time></span><a class="guide-anchor" href="#ui-language">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Un Chrome vero apre l’app nella lingua del sistema. Su un Mac in italiano un selettore come <code>title^=&quot;Rectangle&quot;</code> non trova nulla, perché il pulsante ora si chiama &quot;Rettangolo&quot;, e il controllo fallisce per un motivo che non c’entra con la modifica.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Preferisci selettori che non dipendono dalla lingua: struttura, ruoli, attributi <code>data-*</code> che controlli tu.</li><li>Quando l’app non ha ancora appigli stabili, forza il locale <code>en-US</code> nello strumento browser e scrivilo nella skill verify.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Selettori fragili e robusti</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">javascript</span></div><pre class="guide-code"><code>// A real browser opens the app in the system language: on an Italian Mac the
// &quot;Rectangle&quot; tool is titled &quot;Rettangolo&quot;, and a selector on the label breaks.

// Fragile: depends on the UI language.
document.querySelector(&#039;#toolbar button[title^=&quot;Rectangle&quot;]&#039;);

// Robust: depends on structure or on attributes you own.
document.querySelector(&#039;#toolbar [data-tool=&quot;rectangle&quot;]&#039;);
document.querySelector(&#039;#toolbar button:nth-of-type(3)&#039;);

// If the app has no stable hooks yet, force the locale instead
// (Playwright: contextOptions.locale = &quot;en-US&quot;) and say so in the verify skill.
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="lint-untracked">
	<h2 class="guide-title" id="lint-untracked"><span class="guide-number">04</span><span>Le cartelle locali dell’editor fanno fallire il linter</span></h2>
	<p class="guide-section-meta"><span>aggiunta il <time datetime="2026-11-17">17/11/2026</time></span><a class="guide-anchor" href="#lint-untracked">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why"><code>biome check .</code> attraversa ogni cartella del working tree, comprese le impostazioni locali dell’editor e le cartelle temporanee che non fanno parte del progetto, e fallisce su di esse. L’agente allora &quot;corregge&quot; file che nessuno gli ha chiesto di toccare, o segnala un lint rosso che non è reale.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Fai il lint esattamente di ciò che git conosce: file tracciati più quelli nuovi non ignorati.</li><li>Usa quel comando nella skill verify, così persone e agenti eseguono lo stesso controllo.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Lint solo di ciò che git traccia</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># `biome check .` also walks untracked local folders (editor settings, scratch dirs)
# and fails on files that are not part of the project.
# Lint exactly what git knows about: tracked files plus new, non-ignored ones.
git ls-files -z -co --exclude-standard \
  | xargs -0 pnpm exec biome check --files-ignore-unknown=true --no-errors-on-unmatched
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="secrets-in-transcript">
	<h2 class="guide-title" id="secrets-in-transcript"><span class="guide-number">05</span><span>Un segreto stampato una volta è già perso</span></h2>
	<p class="guide-section-meta"><span class="guide-badge">nuova</span><span>aggiunta il <time datetime="2026-11-18">18/11/2026</time></span><a class="guide-anchor" href="#secrets-in-transcript">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Tutto ciò che un agente stampa entra nel transcript, e il transcript va al fornitore del modello. Basta un <code>cat .env</code> veloce o un <code>grep</code> troppo largo per controllare che una chiave esista, e il suo valore lascia la tua macchina; cancellare il messaggio dopo non lo riporta indietro.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Scrivi la regola nel CLAUDE.md globale: mai stampare qualcosa che può contenere un segreto, quindi niente <code>cat</code>, <code>head</code>, <code>env</code>, <code>printenv</code>, <code>echo</code> o <code>grep</code> semplice su di esso.</li><li>Controlla una chiave solo per nome o per conteggio: <code>grep -q</code>, <code>grep -c</code>, o l’elenco dei nomi delle chiavi.</li><li>Ancora il pattern alla chiave esatta: uno troppo largo trova altre chiavi e ne stampa i valori.</li><li>Se un valore viene stampato comunque, l’agente lo dice subito e il segreto va ruotato, non solo cancellato dalla chat.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Controlli che non stampano valori</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># Everything that enters the transcript goes to the model provider and cannot
# be taken back. Check secrets by name or count, never by value.
ENV_FILE=path/to/your/env/file

# Never: these print values into the conversation.
#   cat &quot;$ENV_FILE&quot;    grep TOKEN &quot;$ENV_FILE&quot;    env    printenv    echo &quot;$API_KEY&quot;

test -r &quot;$ENV_FILE&quot; || echo &quot;cannot read $ENV_FILE&quot;

# Is the key there? Exit code only.
grep -q &#039;^STRIPE_API_KEY=&#039; &quot;$ENV_FILE&quot; &amp;&amp; echo present || echo missing

# How many times is it defined? A count, no value.
grep -c &#039;^STRIPE_API_KEY=&#039; &quot;$ENV_FILE&quot;

# Which keys exist? Names only.
grep -o &#039;^[A-Z_]*=&#039; &quot;$ENV_FILE&quot;

# Anchor the pattern to the exact key, and still never print the line:
#   grep STRIPE &quot;$ENV_FILE&quot;                  also hits STRIPE_WEBHOOK_SECRET, and prints its value
#   grep -c &#039;^STRIPE_API_KEY=&#039; &quot;$ENV_FILE&quot;   one key, a count, no value

# If a value does get printed: say so at once and rotate the secret.
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="global-settings-drift">
	<h2 class="guide-title" id="global-settings-drift"><span class="guide-number">06</span><span>Le impostazioni di progetto finiscono nel file globale</span></h2>
	<p class="guide-section-meta"><span class="guide-badge">nuova</span><span>aggiornata il <time datetime="2026-11-26">26/11/2026</time></span><a class="guide-anchor" href="#global-settings-drift">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Tenere le impostazioni globali dell’agente in un repository git, collegato con un symlink su ogni macchina, ti dà lo stesso setup ovunque. Vuol dire anche che un permesso o un blocco di ambiente scritto per un progetto finisce in silenzio in ogni sessione su ogni macchina, e nessuno se ne accorge finché non dà fastidio.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Scrivi la regola nel CLAUDE.md globale: le impostazioni specifiche di un progetto vanno nel <code>.claude/settings.local.json</code> del progetto, mai nel file globale.</li><li>Prima di spostare un’impostazione, controlla da quali livelli viene davvero letta. L’auto mode di Claude Code legge le sue regole <code>autoMode</code> solo dalle impostazioni utente: un blocco nelle impostazioni di un progetto viene ignorato senza una parola. Tieni un piccolo blocco a livello utente con i fatti veri ovunque, e trasforma i rischi di ogni progetto in regole <code>permissions.ask</code> o <code>deny</code> nel suo <code>settings.local.json</code>, con il contesto che serve al classifier nel suo CLAUDE.md.</li><li>Aggiungi un hook che avvisa quando il file di impostazioni condiviso ha modifiche non committate. Fallo girare su <code>SessionStart</code>, <code>UserPromptSubmit</code> e <code>Stop</code>: un comando integrato può riscrivere il file a metà sessione senza alcuna chiamata a uno strumento, e un controllo solo all’avvio o legato agli strumenti non se ne accorge.</li><li>L’hook si limita ad avvisare ed esce sempre con 0: è la persona a decidere se committare la modifica o spostarla nel progetto.</li><li>Un hook registrato nelle impostazioni condivise esce in silenzio quando il suo script manca: un’altra macchina riceve le impostazioni prima di aver collegato lo script, e un hook che fallisce a ogni prompt è peggio di un controllo che manca.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Regola e hook</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># The global settings file lives in a git repo and is symlinked on every machine:
#   ~/.claude/settings.json -&gt; &lt;your-config-repo&gt;/claude/settings.json
# Project-specific permissions and domains go in the project instead, and stay out of git:
#   &lt;repo&gt;/.claude/settings.local.json
#
# Check where a setting is read from before moving it. Auto mode reads `autoMode`
# only from user settings, so a block in a project is dead config. Keep a small
# user-wide block, and express project risks as permission rules plus context:
#   &lt;repo&gt;/.claude/settings.local.json   {&quot;permissions&quot;: {&quot;ask&quot;: [&quot;Bash(./deploy.sh *)&quot;]}}
#   &lt;repo&gt;/CLAUDE.md                     &quot;db.example.com is the production database.&quot;

# One guard script, registered on three events: a built-in command can rewrite
# the file mid-session without any tool call. If the script is missing (another
# machine pulled the settings before linking it), the hook exits quietly.
{
  &quot;hooks&quot;: {
    &quot;SessionStart&quot;:     [{ &quot;hooks&quot;: [{ &quot;type&quot;: &quot;command&quot;, &quot;command&quot;: &quot;f=\&quot;$HOME/.claude/hooks/check-global-settings.sh\&quot;; [ -f \&quot;$f\&quot; ] || exit 0; sh \&quot;$f\&quot;&quot;, &quot;timeout&quot;: 5 }] }],
    &quot;UserPromptSubmit&quot;: [{ &quot;hooks&quot;: [{ &quot;type&quot;: &quot;command&quot;, &quot;command&quot;: &quot;f=\&quot;$HOME/.claude/hooks/check-global-settings.sh\&quot;; [ -f \&quot;$f\&quot; ] || exit 0; sh \&quot;$f\&quot;&quot;, &quot;timeout&quot;: 5 }] }],
    &quot;Stop&quot;:             [{ &quot;hooks&quot;: [{ &quot;type&quot;: &quot;command&quot;, &quot;command&quot;: &quot;f=\&quot;$HOME/.claude/hooks/check-global-settings.sh\&quot;; [ -f \&quot;$f\&quot; ] || exit 0; sh \&quot;$f\&quot;&quot;, &quot;timeout&quot;: 5 }] }]
  }
}

# check-global-settings.sh: warn, never block. Its stdout reaches the agent.
d=&quot;$HOME/path/to/your-config-repo&quot;
[ -d &quot;$d/.git&quot; ] || exit 0
git -C &quot;$d&quot; diff --quiet -- claude/settings.json 2&gt;/dev/null &amp;&amp; exit 0
echo &#039;WARNING: the shared global settings have uncommitted changes. Tell the user and show the diff stat. Project permissions belong in the project .claude/settings.local.json, project context in its CLAUDE.md.&#039;
exit 0

# The matching rule in the global CLAUDE.md:
#   Never write project-specific settings into the global settings file:
#   it is shared between machines. Use the project&#039;s .claude/settings.local.json.
</code></pre></div>
	
</section><section class="guide-section" aria-labelledby="pr-checks-not-a-pass">
	<h2 class="guide-title" id="pr-checks-not-a-pass"><span class="guide-number">07</span><span>&quot;No checks reported&quot; non è un via libera</span></h2>
	<p class="guide-section-meta"><span class="guide-badge">nuova</span><span>aggiunta il <time datetime="2026-11-23">23/11/2026</time></span><a class="guide-anchor" href="#pr-checks-not-a-pass">#</a></p>
	<div class="guide-label">perché</div>
	<p class="guide-why">Subito dopo l’apertura di una pull request i suoi check potrebbero non essere ancora registrati. Un agente che ne chiede lo stato in quel momento riceve una lista vuota e fa il merge senza che la CI sia mai partita. Un job di review che va in errore, o che finisce in pochi secondi senza recensire nulla, si scambia altrettanto facilmente per verde: un job così può fallire in silenzio per mesi.</p>
	<div class="guide-label">come</div>
	<ol class="guide-steps" role="list"><li>Prima del merge, segui i check finché non sono comparsi e terminati (<code>gh pr checks &lt;n&gt; --watch</code>).</li><li>Una lista vuota subito dopo <code>gh pr create</code> vuol dire &quot;non ancora registrati&quot;: riprova per circa un minuto. Trattala come &quot;nessuna CI&quot; solo quando il repository non ha workflow che girano sulle pull request.</li><li>Una review fallita, o una partita senza recensire (pochi secondi, nessun output), va segnalata alla persona, e il merge non la scavalca mai.</li></ol>
	<div class="guide-snippet"><div class="guide-snippet-title">Aspetta i check, poi il merge</div><div class="guide-snippet-bar"><span class="guide-snippet-lang">bash</span></div><pre class="guide-code"><code># Merge a pull request only once its checks have shown up and passed.
pr=&quot;$1&quot;

# Right after `gh pr create` the checks may not be registered yet:
# &quot;no checks reported&quot; means &quot;wait&quot;, not &quot;green&quot;.
for attempt in $(seq 1 12); do
  gh pr checks &quot;$pr&quot; 2&gt;&amp;1 | grep -q &#039;no checks reported&#039; || break
  sleep 5
done

if gh pr checks &quot;$pr&quot; 2&gt;&amp;1 | grep -q &#039;no checks reported&#039;; then
  # Still nothing after a minute: fine only when no workflow runs on PRs.
  if grep -qs &#039;pull_request&#039; .github/workflows/*.yml .github/workflows/*.yaml; then
    echo &quot;workflows run on pull requests but none reported: stop and ask&quot; &gt;&amp;2
    exit 1
  fi
  echo &quot;no CI on this repo&quot;
else
  gh pr checks &quot;$pr&quot; --watch --fail-fast || {
    echo &quot;a check failed: report it, do not merge&quot; &gt;&amp;2
    exit 1
  }
fi

# A green review that took seconds and wrote nothing did not review:
# open its log before trusting it.
gh pr checks &quot;$pr&quot;
</code></pre></div>
	
</section>
<section class="guide-closing" aria-labelledby="next-up">
	<h2 class="guide-part" id="next-up">Prossimi passi</h2>
	<ul class="guide-roadmap" role="list"><li><span class="guide-roadmap-title"><a class="reader-nav-link" href="#verify-gate">Hook di stop in modalità osservazione</a></span><p>Un hook globale che registra quando una sessione finisce senza verifica, senza ancora bloccare nulla, così i falsi positivi emergono prima che diventi vincolante.</p></li><li><span class="guide-roadmap-title"><a class="reader-nav-link" href="#review-md">Un REVIEW.md per repository</a></span><p>Cosa deve guardare il reviewer per questo codice, letto sempre dal branch di base così una modifica non può riscrivere le proprie regole di review.</p></li><li><span class="guide-roadmap-title"><a class="reader-nav-link" href="#browser-tool">Adottare Playwright MCP</a></span><p>Fatto: le skill verify che pilotano app locali sono passate da Telemaco a Playwright MCP, a partire da Markasso.</p></li><li><span class="guide-roadmap-title"><a class="reader-nav-link" href="#browser-tool">Audit di Telemaco</a></span><p>Fatto con Telemaco 0.3.0: tiene ciò che fa meglio, leggere il web, cercare e fare fetch stealth da CLI e server MCP, mentre server CDP, scrape e remote non ci sono più.</p></li><li><span class="guide-roadmap-title">Un reviewer, più passaggi</span><p>Affinare un solo reviewer e dare a ogni passaggio i risultati e gli errori dei precedenti, invece di accumulare reviewer in parallelo.</p></li><li><span class="guide-roadmap-title">Una checklist di affidabilità attivata dal diff</span><p>Voci di checklist con un trigger leggibile dal diff, abbinate tramite il raggio d’azione di Serval, così su ogni modifica girano solo i pochi controlli pertinenti.</p></li><li><span class="guide-roadmap-title">Un hook che chiede prima di ogni commit</span><p>La regola dice di non fare mai commit senza l’ok della persona, eppure l’agente è scivolato una volta. Un hook su <code>git commit</code> che chiede sempre conferma la renderebbe imposta invece che ricordata.</p></li><li><span class="guide-roadmap-title">Guardrail per le modifiche di sistema</span><p>Un agente che cambia i default del sistema operativo, come l’app che apre un tipo di file, fa comparire una finestra di conferma per ogni modifica e può trascinarsi dietro default non collegati, come il browser. Il piano: provare prima una sola modifica, controllare l’effetto reale invece del codice di uscita del comando, e tenere un backup a cui tornare.</p></li><li><span class="guide-roadmap-title">Merge che chiedono invece di fallire</span><p>Il push e l’apertura di una pull request chiedono già conferma. Il merge non ha una regola simile, così il classifier dell’auto mode lo rifiuta anche dopo un ok esplicito e la persona deve lanciarlo a mano. Una regola <code>ask</code> per <code>gh pr merge</code> trasforma quel rifiuto in una domanda.</p></li><li><span class="guide-roadmap-title">Hook di pre-commit che non allargano mai un commit</span><p>Un hook che lancia un linter che corregge e poi <code>git add -u</code> trascina nel commit in corso ogni altro file modificato, e i commit atomici saltano. Il piano: hook che si limitano a controllare, o che rimettono in stage solo i file che lo erano già.</p></li><li><span class="guide-roadmap-title">Quando un test descrive il comportamento vecchio</span><p>I check esistenti cambiano solo in un commit a parte, ma un’asserzione sul comando o sugli argomenti esatti che si stanno cambiando fallisce senza la modifica e passa solo con essa. Il piano: ammettere quel solo caso nello stesso commit, senza mai allentare il check, nominando ogni check cambiato nel messaggio e avvisando prima la persona.</p></li></ul>
</section>
<section class="guide-closing" aria-labelledby="changelog">
	<h2 class="guide-part" id="changelog">Registro delle modifiche</h2>
	<ol class="guide-changelog" role="list"><li><time datetime="2026-11-26">26/11/2026</time><p>Codex ora è il secondo parere di default, e le CLI dei reviewer girano con stdin chiuso, un file di log e un timeout. Le regole dell’auto mode funzionano solo nelle impostazioni utente, quindi i rischi di progetto diventano regole di permesso. Il registro dei miglioramenti chiede prima di scrivere, i dev server degli agenti non aprono schede del browser, e la roadmap guadagna tre voci.</p><p class="guide-changelog-sections"><a class="reader-nav-link" href="#second-opinion">Un secondo parere con Codex o opencode</a> · <a class="reader-nav-link" href="#global-settings-drift">Le impostazioni di progetto finiscono nel file globale</a> · <a class="reader-nav-link" href="#improvement-log">Un registro dei miglioramenti per il setup stesso</a> · <a class="reader-nav-link" href="#dev-server-port">La porta del dev server è di qualcun altro</a></p></li><li><time datetime="2026-11-23">23/11/2026</time><p>Una nuova insidia: &quot;no checks reported&quot; subito dopo l’apertura di una pull request non è un via libera, e una review partita senza recensire non è verde. In roadmap entrano i guardrail per le modifiche di sistema fatte da un agente.</p><p class="guide-changelog-sections"><a class="reader-nav-link" href="#pr-checks-not-a-pass">&quot;No checks reported&quot; non è un via libera</a></p></li><li><time datetime="2026-11-20">20/11/2026</time><p>Nuovo nome: How we build ora è l’Agent Playbook, su /agent-playbook/ con il comando <code>playbook</code>. I vecchi link, anche quelli a una sezione, continuano a funzionare: portano alla stessa sezione.</p></li><li><time datetime="2026-11-20">20/11/2026</time><p>La roadmap si è rimessa in pari con la realtà: Playwright MCP ora pilota le skill verify e Telemaco è stato snellito, quindi entrambe le voci rimandano alla sezione sullo strumento browser, il cui esempio di Markasso è ora la vera skill con Playwright.</p><p class="guide-changelog-sections"><a class="reader-nav-link" href="#browser-tool">Scegliere lo strumento browser</a></p></li><li><time datetime="2026-11-20">20/11/2026</time><p>Una nuova pratica, un registro dei miglioramenti per il setup stesso, e un’insidia sulle impostazioni di progetto che finiscono nel file globale condiviso. Le review in sola lettura ora vietano anche i comandi che scrivono, e a un repository senza REVIEW.md viene proposta una prima versione ricavata dai suoi commit di fix.</p><p class="guide-changelog-sections"><a class="reader-nav-link" href="#improvement-log">Un registro dei miglioramenti per il setup stesso</a> · <a class="reader-nav-link" href="#global-settings-drift">Le impostazioni di progetto finiscono nel file globale</a> · <a class="reader-nav-link" href="#second-opinion">Un secondo parere con Codex o opencode</a> · <a class="reader-nav-link" href="#review-md">Un REVIEW.md che la modifica non può riscrivere</a></p></li><li><time datetime="2026-11-18">18/11/2026</time><p>Due nuove pratiche, un hook Stop in modalità osservazione e un REVIEW.md letto dal branch di base, e un’insidia sui segreti nel transcript. Il secondo parere ora sceglie il modello in base al compito, la decisione sullo strumento browser è nelle regole globali, e la configurazione di Playwright corrisponde a quella reale.</p><p class="guide-changelog-sections"><a class="reader-nav-link" href="#verify-gate">Un hook Stop che osserva prima di bloccare</a> · <a class="reader-nav-link" href="#review-md">Un REVIEW.md che la modifica non può riscrivere</a> · <a class="reader-nav-link" href="#secrets-in-transcript">Un segreto stampato una volta è già perso</a> · <a class="reader-nav-link" href="#second-opinion">Un secondo parere con Codex o opencode</a> · <a class="reader-nav-link" href="#browser-tool">Scegliere lo strumento browser</a> · <a class="reader-nav-link" href="#claude-md-rules">Regole di verifica nel CLAUDE.md</a></p></li><li><time datetime="2026-11-17">17/11/2026</time><p>Prima edizione: sei pratiche, quattro insidie e una roadmap, su una pagina tutta sua con un link per ogni sezione.</p></li></ol>
